[project]
name = "agent-playtime"
version = "0.1.0"
description = "A minimal, staged playground for learning LangGraph agents on local models"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.scripts]
playtime = "playtime.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playtime"]
